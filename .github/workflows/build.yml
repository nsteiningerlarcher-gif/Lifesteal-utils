
name: Build Lifesteal Utility

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: current

      - name: Build mod
        working-directory: Lifesteal-Utility-Fabric-26.1.2-Online-Build/lifesteal-utility
        run: gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Lifesteal-Utility-Fabric-26.1.2
          path: Lifesteal-Utility-Fabric-26.1.2-Online-Build/lifesteal-utility/build/libs/*.jar
          if-no-files-found: error
